name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: npm install -g mystmd@1.6.7
      # The check fails the build on a malformed entry; the regeneration must leave
      # the tree unchanged, or someone committed without running it.
      - run: python3 scripts/build_index.py --check
      - run: python3 scripts/build_index.py
      - run: git diff --exit-code -- index.md entries.md digests.md myst.yml topics benchmarks campaigns
      - run: myst build --html
        env:
          BASE_URL: /underworld3-journal
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
